<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fluffy Birb</title>
<link rel="stylesheet" href="style.css"></head><body>
<div id="wrap"><div id="stage">
<canvas id="c" width="360" height="640"></canvas>
<div id="hud"><button id="bm">🔊</button><button id="bp" aria-label="Pause">⏸</button></div>
<div class="ov on" id="menu"><h1>Fluffy Birb</h1>
 <div class="card"><canvas id="pv" width="100" height="64"></canvas>
  <div class="row" id="cols"></div><div class="row" id="types"></div><div class="row" id="diffs"></div></div>
 <button class="big" id="play">Play</button></div>
<div class="ov" id="pause"><h2>Paused</h2><button class="big" id="res">Resume</button><button id="rst">Restart</button><button id="mm">Main menu</button></div>
<div class="ov" id="over"><h1>Fluffy Birb</h1><h2>Game over</h2><p id="fs"></p><p id="bs"></p><button class="big" id="retry">Retry</button><button id="mm2">Main menu</button></div>
</div></div>
<script src="game.js"></script></body></html>
